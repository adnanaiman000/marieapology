<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm Sorry</title>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom right, #ffcccc, #ffe6e6);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      margin-bottom: 30px;
      color: #cc0000;
    }

    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      min-width: 160px;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      box-shadow: 0 0 10px #28a745;
    }

    #yesBtn:hover {
      background-color: #218838;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      position: relative;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>
      I'm really sorry for misusing my words to hurt you 🙇‍♂️  
      <br />Will you forgive me?
    </h1>

    <div class="buttons">
      <button id="yesBtn" onclick="accepted()">Yes, I forgive you 😄</button>
      <button id="noBtn" onclick="notAccepted()">No</button>
    </div>
  </div>

  <script>
    // INIT EMAILJS
    emailjs.init("ivmgAJa_-66LBfPm0"); // ← change later

    function accepted() {
      // SEND EMAIL PROOF
      emailjs.send("service_xffk04b", "template_w0rlw4k", {
        time: new Date().toLocaleString(),
        browser: navigator.userAgent,
        message: "Forgiveness accepted by user ❤️"
      });

      document.body.innerHTML = `
        <h1 style="color:green; padding:20px;">
          Yay! Thank you ❤️<br />
          You're the besttt, Mummyyy!
        </h1>
      `;
    }

    function notAccepted() {
      const noBtn = document.getElementById("noBtn");

      const x = Math.floor(Math.random() * 200) - 100;
      const y = Math.floor(Math.random() * 200) - 100;

      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
